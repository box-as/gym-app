services:
  repstate:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      SYNC_USERNAME: ${SYNC_USERNAME:-}
      SYNC_EMAIL: ${SYNC_EMAIL:-}
      SYNC_PASSWORD_HASH: ${SYNC_PASSWORD_HASH:-}
    volumes:
      - repstate-data:/data
    expose:
      - "8000"

volumes:
  repstate-data:
